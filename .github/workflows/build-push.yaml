# GitHub Actions 版本锁定：使用 commit SHA，注释标明对应 tag。
# 规范见 .cursor/rules/github-actions-pinning.mdc
name: Build and Push Container Images

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: "Semver X.Y.Z（不含 v 前缀）"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            # 从 git tag vX.Y.Z 去掉前缀 v
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate semver
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: Invalid semver: ${VERSION}"
            exit 1
          fi
          echo "Valid semver: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test /health
        run: |
          TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          echo "Smoke testing image: ${TAG}"

          docker run --rm -d --name smoke-test \
            -p 8000:8000 \
            -e DATABASE_URL=mysql+asyncmy://root@127.0.0.1:3306/ecommerce \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            -e JWT_SECRET_KEY=smoke-test-secret-key-at-least-32-bytes!! \
            "${TAG}"

          # 等待 uvicorn 就绪
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "/health OK"
              break
            fi
            echo "Waiting for container to be ready... ($i/15)"
            sleep 2
          done

          # 验证响应体
          HEALTH=$(curl -sf http://127.0.0.1:8000/health)
          echo "Response: $HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"' || (echo "FAIL: health check" && exit 1)

          docker stop smoke-test

          # /health/ready 应在 compose/deploy 阶段验证（有 MySQL/Redis sidecar）
          echo "Smoke test passed."
