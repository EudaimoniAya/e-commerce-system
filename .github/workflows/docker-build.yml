# Docker 镜像构建 + push GHCR + /health 烟雾
# 规范见 openspec/changes/infra-ci-docker/design.md §6-7
name: Docker Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # feature 分支不自动 build；如需手动触发
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main push → latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # v* tag → semver（v1.0.0, v1.0, v1）
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 每次 build → sha-<short>
            type=sha,prefix=sha-

      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test /health
        run: |
          # 提取第一个 tag 用于 smoke test
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          echo "Smoke testing image: $TAG"

          docker run --rm -d --name smoke-test \
            -p 8000:8000 \
            -e DATABASE_URL=mysql+asyncmy://root@127.0.0.1:3306/ecommerce \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            -e JWT_SECRET_KEY=smoke-test-secret-key-at-least-32-bytes!! \
            "$TAG"

          # 等待 uvicorn 就绪
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "/health OK"
              break
            fi
            echo "Waiting for container to be ready... ($i/15)"
            sleep 2
          done

          # 验证响应体
          HEALTH=$(curl -sf http://127.0.0.1:8000/health)
          echo "Response: $HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"' || (echo "FAIL: health check" && exit 1)

          docker stop smoke-test

          # /health/ready 应在 compose/deploy 阶段验证（有 MySQL/Redis sidecar）
          echo "Smoke test passed."
