# GitHub Actions 版本锁定：使用 commit SHA，注释标明对应 tag。
# 规范见 .cursor/rules/github-actions-pinning.mdc
name: Run Tests

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  # 无输入：手动全量 lint + test（feature 分支验证、绕过 paths-filter）
  workflow_dispatch:

env:
  # CI 使用 TCP 连接 mysql service container（与本地 devbox unix socket 不同）
  DATABASE_URL: mysql+asyncmy://root@127.0.0.1:3306/ecommerce_test?charset=utf8mb4
  REDIS_URL: redis://127.0.0.1:6379/1
  JWT_SECRET_KEY: ci-test-secret-key-at-least-32-bytes!!
  APP_ENV: test
  SMS_OTP_FIXED_CODE: "123456"
  APP_ENV_FILE: .env.test

jobs:
  # ── filter：路径筛选，仅 code 变更时运行 lint + test ─────────────────
  filter:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.code.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Paths filter
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: .github/utils/file-filters.yaml

      - name: Set code output
        id: code
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=${{ steps.filter.outputs.code }}" >> "$GITHUB_OUTPUT"
          fi

  # ── lint：ruff + check-test-imports，无 DB/Redis 依赖 ──────────────
  lint:
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1

      - name: Set up go-task
        uses: go-task/setup-task@0ab1b2a65bc55236a3bc64cde78f80e20e8885c2 # v1.0.0

      - name: Sync dependencies
        run: task sync

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Lint (ruff)
        run: task ruff

      - name: Check test imports
        run: task check-test-imports

  # ── test：单 job 全量 pytest，无 domain matrix ─────────────────────
  test:
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: ecommerce_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:8.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1

      - name: Set up go-task
        uses: go-task/setup-task@0ab1b2a65bc55236a3bc64cde78f80e20e8885c2 # v1.0.0

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          # 对 uv.lock 哈希，依赖不变 -> key不变 -> 缓存命中
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Sync dependencies
        run: task sync

      - name: Ensure test database exists
        run: |
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS ecommerce_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run full test suite
        env:
          PYTEST_ADDOPTS: --alluredir=allure-results
        run: task test

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

  # ── test-failure-alert：上游失败时确保 required check 仍 fail ─────
  test-failure-alert:
    needs: [filter, lint, test]
    if: always() && (failure() || cancelled())
    runs-on: ubuntu-latest
    steps:
      - name: Alert on test failure
        run: exit 1
