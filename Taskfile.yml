version: "3"

tasks:
  sync:
    desc: 同步 Python 依赖（uv sync）
    cmds:
      - uv sync

  ruff:
    desc: 运行 ruff lint
    cmds:
      - uv run ruff check .

  format:
    desc: 用 ruff formatter 格式化全库 Python
    cmds:
      - uv run ruff format .

  format:check:
    desc: 校验全库 Python 是否已 ruff 格式化（CI 门禁）
    cmds:
      - uv run ruff format --check .

  check-test-imports:
    desc: 禁止 tests 域内 test_ 模块互 import
    cmds:
      - bash scripts/check_no_test_cross_imports.sh

  check-app-layer-discipline:
    desc: AST 强制应用层边界纪律（_* 私有名不跨模块 / 跨域白名单 / current-deps 仅本域 router）
    cmds:
      - uv run python scripts/check_app_layer_discipline.py

  test:
    desc: 运行全量 pytest（自动加载 `.env.test`）
    env:
      APP_ENV_FILE: .env.test
    cmds:
      # pytest 无测试收集时返回 5；包装为 0，真实失败仍向上传递
      - uv run python -c "import subprocess,sys;c=subprocess.run([sys.executable,'-m','pytest']);sys.exit(0 if c.returncode in (0,5) else c.returncode)"

  test:reports:
    desc: 运行 pytest 并生成 Allure 报告
    deps:
      - db:up
    env:
      APP_ENV_FILE: .env.test
    cmds:
      - uv run python -c "import subprocess,sys;c=subprocess.run([sys.executable,'-m','pytest','--alluredir=reports/allure-results']);sys.exit(0 if c.returncode in (0,5) else c.returncode)"
      - allure generate -o reports/allure-report --clean reports/allure-results

  latest:report:
    desc: 在浏览器中打开最近生成的 Allure 报告
    cmds:
      - bash scripts/allure_open_report.sh

  ci:
    desc: 本地 CI（format check + ruff + test-import + app-layer-discipline + test）
    deps:
      - db:up
    cmds:
      - task: format:check
      - task: ruff
      - task: check-test-imports
      - task: check-app-layer-discipline
      - task: migrate:all
      - task: test

  # ---------------------------------------------------------------------------
  # 三库总闸（db:* 同时作用于 MySQL / Redis / PostgreSQL）
  # ---------------------------------------------------------------------------
  db:up:
    desc: 三库总闸：启动 MySQL / Redis / PostgreSQL（同一只 process-compose）
    cmds:
      - bash scripts/devbox/db_up.sh

  db:down:
    desc: 三库总闸：停止 MySQL / Redis / PostgreSQL（监督器不拆除）
    cmds:
      - bash scripts/devbox/db_down.sh

  db:reset:
    desc: 三库总闸：停止三库 → 清空整个 db-data/ → 重新启动（开发用，慎用）
    cmds:
      - bash scripts/devbox/db_reset.sh

  # ---------------------------------------------------------------------------
  # 分库：mysql
  # ---------------------------------------------------------------------------
  mysql:up:
    desc: 启动 MySQL（process-compose 内）并确保 dev/test 双库存在
    cmds:
      - bash scripts/devbox/mysql_up.sh

  mysql:down:
    desc: 停止 MySQL（带名，不拆整只监督器）
    cmds:
      - bash scripts/devbox/mysql_down.sh

  mysql:reset:
    desc: 停止 MySQL → 清除 db-data/mysql → 重新启动（开发用，慎用）
    cmds:
      - bash scripts/devbox/mysql_reset.sh

  # ---------------------------------------------------------------------------
  # 分库：redis
  # ---------------------------------------------------------------------------
  redis:up:
    desc: 启动 Redis（process-compose 内）并轮询就绪
    cmds:
      - bash scripts/devbox/redis_up.sh

  redis:down:
    desc: 停止 Redis（带名，不拆整只监督器）
    cmds:
      - bash scripts/devbox/redis_down.sh

  redis:reset:
    desc: 停止 Redis → 清除 db-data/redis → 重新启动（开发用，慎用）
    cmds:
      - bash scripts/devbox/redis_reset.sh

  # ---------------------------------------------------------------------------
  # 分库：pg
  # ---------------------------------------------------------------------------
  pg:up:
    desc: 启动 PostgreSQL 16（含 pgvector）并确保 AI dev/test 双库存在
    cmds:
      - bash scripts/devbox/pg_up.sh

  pg:down:
    desc: 停止 PostgreSQL（带名，不拆整只监督器）
    cmds:
      - bash scripts/devbox/pg_down.sh

  pg:reset:
    desc: 停止 PostgreSQL → 清除 db-data/postgres → 重新启动（开发用，慎用）
    cmds:
      - bash scripts/devbox/pg_reset.sh

  # ---------------------------------------------------------------------------
  # 迁移与业务任务
  # ---------------------------------------------------------------------------
  migrate:
    desc: 执行 Alembic 迁移至 head（默认 DATABASE_URL 指向 dev 库）
    deps:
      - mysql:up
    cmds:
      - uv run alembic upgrade head

  migrate:ai:
    desc: 执行 AI 库 Alembic 迁移至 head（alembic_ai.ini）
    deps:
      - pg:up
    cmds:
      - uv run alembic -c alembic_ai.ini upgrade head

  migrate:all:
    desc: 依次执行 MySQL 与 AI 库 migrate
    cmds:
      - task: migrate
      - task: migrate:ai

  migrate:new:
    desc: 创建新 Alembic revision（autogenerate），用法 task migrate:new -- "描述"
    cmds:
      - uv run alembic revision --autogenerate -m '{{default "migration" .CLI_ARGS}}'

  browse:trim:
    desc: 按 top N + retention 裁剪 user_browse_history（生产由 cron 独立进程定时执行）
    cmds:
      - uv run python -m app.engagement.jobs.trim_browse_history

  ai:reindex-shop:
    desc: 整店重建 RAG 语料（catalog_text + media_document；含 orphan 清理）。用法：task ai:reindex-shop -- <shop_id>
    deps:
      - db:up
    cmds:
      - uv run python -m app.ai.jobs.reindex_cli shop --shop-id {{.CLI_ARGS}}

  ai:reindex-product:
    desc: 重建单商品全部文档（catalog_text + media_document）。用法：task ai:reindex-product -- <product_id>
    deps:
      - db:up
    cmds:
      - uv run python -m app.ai.jobs.reindex_cli product --product-id {{.CLI_ARGS}}

  ai:reindex-document:
    desc: 重建单文档（document_id 由 source_kind 消歧）。用法：task ai:reindex-document -- --source-kind catalog_text|media_document --document-id <uuid>
    deps:
      - db:up
    cmds:
      - uv run python -m app.ai.jobs.reindex_cli document {{.CLI_ARGS}}

  dev:
    desc: 启动开发服务器（uvicorn --reload）
    deps:
      - db:up
    cmds:
      - uv run uvicorn app.main:app --reload
