[project]
name = "e-commerce-system"
version = "0.1.0"
description = "AI 赋能电商个人项目"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncmy",
    "alembic",
    "pydantic-settings",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
