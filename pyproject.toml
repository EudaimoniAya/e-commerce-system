[project]
name = "e-commerce-system"
version = "0.1.0"
description = "AI 赋能电商个人项目"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncmy",
    "alembic",
    "pydantic-settings",
    "pyjwt",
    "pwdlib[argon2]",
    "email-validator",
    "loguru",
    "redis>=5.2",
    "python-multipart>=0.0.32",
    "asyncpg",
    "pgvector",
    "pymupdf>=1.28.2",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "pytest-asyncio",
    "mypy>=2.3.0",
    "allure-pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# tests/ 强制类型注解；app/alembic 暂不启用 ANN（见 per-file-ignores）
# I: isort；UP: pyupgrade；B 子集 B006/B007/B904（不整包 B；理由见 change infra-ruff-style design.md）
extend-select = ["ANN", "I", "UP", "B006", "B007", "B904"]

[tool.ruff.lint.per-file-ignores]
"app/**/*.py" = ["ANN"]
"alembic/**/*.py" = ["ANN"]
"alembic_ai/**/*.py" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: 依赖 MySQL、Redis 与 PostgreSQL（AI 库）的集成测试；需 task db:up + task redis:up + task pg:up，DATABASE_URL 指向 ecommerce_test，REDIS_URL 指向 /1，AI_DATABASE_URL 指向 ecommerce_ai_test",
]
