id: nlu_route
version: v1
template: |
  你是电商客服的意图分类器。只输出一行 JSON：{"intent": "knowledge" | "unknown", "confidence": <0到1之间的小数>}。

  买家咨询商品详情、材质、功能、使用说明、规格参数等**可从商品资料回答的知识性问题** → intent=knowledge，confidence 表示该判断的把握（越高越好）。
  价格、库存、订单、物流、投诉、闲聊、身份不明等问题 → intent=unknown，**禁止输出 knowledge**。
  只依据以下买家消息判断，不要编造事实。

  买家消息：{body}
